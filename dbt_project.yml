
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'simple_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: snowflake

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

models:
  simple_project:
    +materialized: view
    marts:
      +materialized: table
    +persist_docs:
      relation: false
      columns: false
    +post-hook:
      - "{{ apply_alation_comments(this) }}"
#   1. Turn OFF dbt's native persist_docs everywhere (it has no diffing
#      logic and, on Snowflake, silently blanks the comment on any column
#      that isn't in the YAML `columns:` list — see README "Known landmine").
#   2. Add a project-wide post-hook that calls our own macro instead, which
#      applies Alation-mastered descriptions where they exist and falls
#      back to YAML where they don't.
# --------------------------------------------------------------------------
 
seeds:
  simple_project:
    +schema: alation_metadata
    alation_table_comments:
      +column_types:
        schema_name: varchar(200)
        table_name: varchar(200)
        data_source: varchar(200)
        alation_table_description: varchar(16000)
        alation_table_url: varchar(1000)
    alation_column_comments:
      +column_types:
        schema_name: varchar(200)
        table_name: varchar(200)
        column_name: varchar(200)
        data_source: varchar(200)
        alation_column_description: varchar(16000)
        alation_column_url: varchar(1000)
vars:
  alation_comments:
    enabled: true
    # Substring matched against the seed's DATA_SOURCE column (case-insensitive).
    # Mirrors Paul's real Alation query pattern: `DATA_SOURCE LIKE '%HDP%'`.
    # Set to "" to disable the filter entirely.
    data_source_filter: "JAFFLE_SANDBOX"
    # keep_existing | yaml | fail — what to do if the Alation table/column
    # seeds (later: the real Snowflake share) can't be found at all.
    on_unavailable: yaml
    # A description exactly equal to this value means "explicitly remove
    # the comment" rather than "no opinion" (a blank/empty description is
    # always treated as "no opinion" and never erases an existing comment).
    tombstone_value: "__REMOVE_COMMENT__"
    # Defensive cap — Snowflake itself doesn't document a hard COMMENT
    # length limit, but very long comments bloat DESCRIBE/SHOW output and
    # IDE tooltips, so we truncate with a warning past this many characters.
    max_comment_length: 8000
    # If more than one Alation row maps to the same schema.table[.column],
    # fail loudly instead of silently picking one.
    fail_on_ambiguous_lookup: true


